services:
  # ------------------------------------------
  # Database Service (PostgreSQL)
  # ------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: exam_user
      POSTGRES_PASSWORD: exam_password
      POSTGRES_DB: exam_db
    # Database is only accessible internally via Docker network
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam_user -d exam_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------
  # Core Backend API (Exam Middleware)
  # ------------------------------------------
  middleware:
    image: senthankumar/exam-middleware:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://exam_user:exam_password@postgres:5432/exam_db
      ML_SERVICE_URL: http://ml-service:7860
      MOODLE_BASE_URL: http://lms.ai.saveetha.in
      SECRET_KEY: "change_this_to_a_secure_random_string_in_production"
      ENVIRONMENT: production
    # Port 8000 is only accessible internally (proxied by frontend)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ------------------------------------------
  # Answer Sheet ML Inference (PyTorch/YOLO)
  # ------------------------------------------
  ml-service:
    image: senthankumar/exam-ml-service:latest
    restart: unless-stopped
    environment:
      PORT: 7860
    # Port 7860 is only accessible internally via Docker network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ------------------------------------------
  # API Gateway & Frontend (Nginx Reverse Proxy)
  # THE ONLY EXTERNALLY EXPOSED PORT
  # ------------------------------------------
  frontend:
    image: senthankumar/exam-frontend:latest
    restart: unless-stopped
    depends_on:
      - middleware
    ports:
      - "8000:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pgdata:
