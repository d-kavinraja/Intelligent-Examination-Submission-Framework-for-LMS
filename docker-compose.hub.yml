version: '3.8'

services:
  # ------------------------------------------
  # Database Service (PostgreSQL)
  # ------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: exam_user
      POSTGRES_PASSWORD: exam_password
      POSTGRES_DB: exam_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam_user -d exam_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------
  # Core Backend API (Exam Middleware)
  # ------------------------------------------
  middleware:
    image: senthankumar/exam-middleware:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://exam_user:exam_password@postgres:5432/exam_db
      REDIS_URL: redis://redis:6379/0
      ML_SERVICE_URL: http://ml-service:7860
      SECRET_KEY: "change_this_to_a_secure_random_string_in_production"
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ------------------------------------------
  # Answer Sheet ML Inference (PyTorch/YOLO)
  # ------------------------------------------
  # Default CPU-based ML Service
  ml-service:
    image: senthankumar/exam-ml-service:latest
    restart: unless-stopped
    environment:
      PORT: 7860
    ports:
      - "7860:7860"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ------------------------------------------
  # Frontend Static Service (Nginx)
  # ------------------------------------------
  frontend:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./assets:/usr/share/nginx/html/assets:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pgdata:
