services:
  ml-service:
    build:
      context: ./hf_space
      dockerfile: Dockerfile.gpu
    environment:
      PORT: "7860"
      PYTHONUNBUFFERED: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
