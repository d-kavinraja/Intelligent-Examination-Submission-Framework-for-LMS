server {
    listen 80;
    server_name _;

    # Increase max upload size for answer sheet submissions
    client_max_body_size 50M;

    # Serve static frontend
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ =404;
    }

    # Proxy dynamic requests to middleware
    location ~ ^/(portal|api|docs|openapi.json|static|health|auth|upload|student|admin|extract|redoc) {
        proxy_pass http://middleware:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running ML extraction requests
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }
}
