name: Build and Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - complete-application-setup-local-remote

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend-landing/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend-landing
          npm ci

      - name: Build Application
        run: |
          cd frontend-landing
          npm run build

      - name: Commit and Push Release Build
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html assets/
          git diff-index --quiet HEAD || git commit -m "chore: automated build release [skip ci]"
          git push origin complete-application-setup-local-remote
